version: 2

models:
  - name: stg_game__users
    description: >
      One row per player; the grain is user_id. Renames and casts the columns of
      the events source and contains no business logic.
    columns:
      - name: user_id
        description: Player identifier and primary key.
        data_tests:
          - unique
          - not_null
      - name: version
        description: A/B group from Cookie Cats.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["gate_30", "gate_40"]
      - name: acquisition_channel
        description: Synthetic acquisition channel.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Instagram", "Facebook", "TikTok", "Organic"]
      - name: country
        description: Synthetic country.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["USA", "Mexico", "Brazil"]
      - name: platform
        description: Synthetic platform.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["App Store", "Google Play"]
      - name: session_count
        description: Game rounds played, from Cookie Cats sum_gamerounds.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: is_retained_d1
        description: "{{ doc('d1_retention') }} Regenerated from the synthetic config."
        data_tests:
          - not_null
      - name: is_retained_d7
        description: "{{ doc('d7_retention') }} Regenerated from the synthetic config."
        data_tests:
          - not_null
      - name: has_purchased
        description: Whether the player made a purchase (synthetic).
        data_tests:
          - not_null
      - name: cac
        description: Synthetic acquisition cost of this player.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: revenue
        description: Synthetic revenue from this player.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: roi
        description: Per-player (revenue - cac) / cac, as written by the generator.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
