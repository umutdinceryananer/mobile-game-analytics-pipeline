version: 2

sources:
  - name: game
    description: >
      Synthetic player table written by `make data`. Paths are relative to the
      dbt/ directory, so run dbt from there.
    meta:
      external_location: "../data/processed/{name}.parquet"
    tables:
      - name: events
        description: >
          One row per player. Only userid, version and session_count hold original
          Cookie Cats values; every other column is generated by
          data/make_dataset.py from data/config/synthetic.yaml.
        columns:
          - name: userid
            description: Original Cookie Cats player identifier.
          - name: version
            description: Original Cookie Cats A/B group (gate_30 or gate_40).
          - name: session_count
            description: Original Cookie Cats sum_gamerounds, renamed.
          - name: retention_1
            description: Regenerated D1 return flag (0 or 1).
          - name: retention_7
            description: Regenerated D7 return flag (0 or 1).
          - name: acquisition_channel
            description: Synthetic channel, assigned from a hash of userid.
          - name: country
            description: Synthetic country, assigned from a hash of userid.
          - name: platform
            description: Synthetic platform, assigned from a hash of userid.
          - name: purchase
            description: Synthetic purchase flag (0 or 1).
          - name: CAC
            description: Synthetic acquisition cost, fixed per channel in the config.
          - name: revenue
            description: Synthetic revenue per player.
          - name: ROI
            description: Derived per-player (revenue - CAC) / CAC.
