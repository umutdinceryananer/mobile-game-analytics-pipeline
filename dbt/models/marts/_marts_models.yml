version: 2

models:
  - name: mart_installs_by_channel
    description: One row per acquisition channel, with the number of installed players.
    columns:
      - name: acquisition_channel
        description: Synthetic acquisition channel; the primary key.
        data_tests:
          - unique
          - not_null
      - name: users
        description: Number of players assigned to the channel.
        data_tests:
          - not_null

  - name: mart_funnel_step_rates
    description: "One row with the overall funnel ratios. {{ doc('funnel_step_rate') }}"
    columns:
      - name: n_users
        description: Total number of players.
        data_tests:
          - not_null
      - name: rate_install
        description: "{{ doc('funnel_step_rate') }} Here, install total divided by player count."
        data_tests:
          - not_null
      - name: rate_d1_from_install
        description: "{{ doc('d1_retention') }}"
        data_tests:
          - not_null
      - name: rate_d7_from_d1
        description: "{{ doc('funnel_step_rate') }} Here, D7 return total divided by D1 return total."
        data_tests:
          - not_null
      - name: rate_purchase_from_d7
        description: "{{ doc('funnel_step_rate') }} Here, purchase total divided by D7 return total."
        data_tests:
          - not_null

  - name: mart_funnel_by_channel
    description: "One row per acquisition channel with funnel ratios. {{ doc('funnel_step_rate') }}"
    columns:
      - name: acquisition_channel
        description: Synthetic acquisition channel; the primary key.
        data_tests:
          - unique
          - not_null
      - name: n_users
        description: Number of players assigned to the channel.
        data_tests:
          - not_null
      - name: rate_d1_from_install
        description: "{{ doc('d1_retention') }}"
        data_tests:
          - not_null
      - name: rate_d7_from_d1
        description: "{{ doc('funnel_step_rate') }} Here, D7 return total divided by D1 return total."
        data_tests:
          - not_null
      - name: rate_purchase_overall
        description: Purchase total divided by player count.
        data_tests:
          - not_null

  - name: mart_channel_roi
    description: >
      One row per acquisition channel with revenue, spend, ROI and ROAS. ROAS
      differences come from the CAC values set in the synthetic config.
    columns:
      - name: acquisition_channel
        description: Synthetic acquisition channel; the primary key.
        data_tests:
          - unique
          - not_null
      - name: users
        description: Number of players assigned to the channel.
        data_tests:
          - not_null
      - name: revenue
        description: Total synthetic revenue of the channel.
        data_tests:
          - not_null
      - name: ad_spend
        description: Total synthetic acquisition cost of the channel.
        data_tests:
          - not_null
      - name: roi
        description: "{{ doc('roi') }}"
        data_tests:
          - not_null
      - name: roas
        description: "{{ doc('roas') }}"
        data_tests:
          - not_null
